# Gerçek OpenAI + Cohere + Supabase çağrısı yapan her şey burada toplanır.
#
# Neden push'ta değil: para harcıyor ve model çıktısı deterministik değil, her
# push'ta koşarsa hem fatura hem gürültü üretir.
#
# Neden fixture/replay değil: 2026-08-26'da integration testleri üç gerçek bug
# yakaladı (uydurma e-posta adresi, "how?"un selamlama sanılması, projelerin
# istihdam rozetiyle görünmesi). Üçü de modelin ne yaptığıyla ilgiliydi;
# kaydedilmiş skorlarla replay edilseler hiçbiri yakalanamazdı. Bu testlerin
# değeri tam olarak gerçek olmalarında — o yüzden gerçek kalıyorlar.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"   # UTC 03:00
  workflow_dispatch:

jobs:
  gercek-api:
    runs-on: ubuntu-latest
    env:
      # MODE=local KRİTİK: prod chat_logs / chat_messages tablolarına tek satır
      # yazılmasın. Eval trafiği gerçek kullanıcı trafiğine karışırsa "bu soru
      # canlıda mı soruldu" sorusunu bir daha DB'den cevaplayamayız.
      MODE: local
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Settings'te zorunlu alan ama eval hiçbir admin endpoint'ine dokunmuyor;
      # gerçek anahtarı CI'a taşımanın sebebi yok.
      ADMIN_API_KEY: nightly-kullanilmiyor
    steps:
      - uses: actions/checkout@v4

      # Secret'lar tanımlı değilken job'ın her gece kırmızı yanıp e-posta
      # göndermesi, gerçek bir kırılmayı da görünmez yapar. Uyarıyla atla.
      - name: Secret kontrolü
        id: kontrol
        env:
          ANAHTAR: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANAHTAR" ]; then
            echo "::warning::Secret'lar tanımlı değil; gerçek API adımları atlanıyor."
            echo "hazir=false" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.kontrol.outputs.hazir == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Bağımlılıklar
        if: steps.kontrol.outputs.hazir == 'true'
        run: pip install -e "./backend[dev]"

      # 32 golden retrieval vakası da bunun içinde (tests/test_retrieval_eval.py),
      # her vaka ayrı test olarak. Bu yüzden ayrıca `eval.run_eval` çağrılmıyor:
      # aynı 32 vakayı aynı is_hit ile ikinci kez koşmak olurdu. run_eval elde
      # kalıyor ama rolü farklı — öncesi/sonrası karşılaştırması için rapor aracı.
      - name: Integration testleri
        if: steps.kontrol.outputs.hazir == 'true'
        working-directory: backend
        run: pytest -m integration -q -rs

      # 42 vaka, hepsi ya canlı chat_logs trafiğinden ya canlı probe'dan geldi.
      # Eşik yok, tam puan bekleniyor: her vaka bir kez gerçekten kırıktı.
      - name: Routing eval (42 vaka)
        if: always() && steps.kontrol.outputs.hazir == 'true'
        working-directory: backend
        run: python -m eval.run_routing

      # Cevaptaki her iddia, modele gösterilen chunk'larda var mı? Eşik 1.0 ve
      # bilerek: %90 "cevapların onda biri yalan" demek. Hakem üretenden ayrı ve
      # daha güçlü bir model — kendi cevabını kendine denetletmek ölçüm değildir.
      - name: Groundedness eval (14 vaka)
        if: always() && steps.kontrol.outputs.hazir == 'true'
        working-directory: backend
        run: python -m eval.run_groundedness

  # Secret gerektirmiyor, para harcamiyor — ayri is olmasinin sebebi bu: yukaridaki
  # is secret'lar tanimli degilken atlaniyor, bu kontrolun ise her gece kosmasi lazim.
  cloudflare-ip-listesi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # backend/app/cloudflare.py'deki araliklar CF-Connecting-IP'ye guvenip
      # guvenmeyecegimize karar veriyor. Liste eskirse yeni bir Cloudflare
      # araligindan gelen mesru ziyaretci "dogrudan baglanti" sayilir ve
      # rate limit kovasi yanlis anahtara baglanir. Sessiz bozulma; her gece bakilir.
      - name: Cloudflare araliklari guncel mi
        run: ./scripts/cloudflare-ip-kontrol.sh
