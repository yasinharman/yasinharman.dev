# Routing eval — FAZ 2.2a
#
# KAYNAK: uydurma soru YOK. Hepsi ya canlı chat_logs'tan (gerçek ziyaretçiler)
# ya da 2026-08-26'da canlı bota atılan probe'lardan geldi. Yazım hataları
# BİLEREK korundu — gerçek kullanıcı böyle yazıyor.
#
# Kategoriler (FAZ 3.1'deki Route.category ile birebir):
#   career    -> bilgi tabanında karşılığı olabilir; MUTLAKA aranmalı.
#                Retrieval boş dönerse dürüstçe "bu bilgi yok" denir — ama
#                ARAMADAN "bilgim yok" demek HATADIR.
#   personal  -> korpusta olmayan kişisel detay; aranmadan nazikçe reddedilir.
#   unrelated -> Yasin'le ilgisiz, hakaret, test mesajı, bot'a meta soru.
#   courtesy  -> teşekkür/selamlama. Aranmaz ama REDDEDİLMEZ de: nazik bir
#                karşılık verilir. Dördüncü kategori olarak eklendi çünkü
#                unrelated'in sabit cevabı ("yardımcı olamam") burada yanlış.
#
# Kullanım: her satır tek bir sınıflandırma assert'i. LLM'in cevap ÜRETMESİ
# gerekmez, yalnızca kategori. Hedef: >= %95 doğruluk (bkz. yapilacaklar 3.1).

cases:

# ---------------------------------------------------------------------------
# 🔴 CANLI BUG: çıplak proje adı. Hepsi bugün RED alıyor, hepsi career olmalı.
#    "proje" veya "Yasin" kelimesi eklenince aynı soru cevaplanıyor — yani
#    sınıflandırıcı konuya değil yüzeysel ipuçlarına bakıyor.
# ---------------------------------------------------------------------------
  - id: proje-bdf-ciplak
    question: Business Data Finder nedir
    expect: career
    regression: true
  - id: proje-internship-ciplak
    question: Internship Tracker hangi tur ilanlari topluyor?
    expect: career
    regression: true
  - id: proje-jarvis-ciplak
    question: Jarvis nedir
    expect: career
    regression: true
  - id: proje-rag-agent-ciplak
    question: RAG Agent projesi nedir
    expect: career
    regression: true

# ---------------------------------------------------------------------------
# 🔴 CANLI BUG (2026-08-28): bozuk yazılmış teknoloji adı + öznesiz soru.
#    "Docker biliyor mu" çalışıyor, "Docekr biliyo mu" KAPSAM REDDİ alıyor.
#    Ölçüldü: 10 vakalık örneklemde 3 red. Prompt'ta yazım hatası kuralı ZATEN
#    var ama özel ad tanınmayınca geriye konu kalmıyor ("biliyo mu").
#    Retrieval'a havale etmek de çözüm değil: aynı sorgular aramada da boş
#    dönüyor (ölçüldü), yani arama hakem olamıyor.
# ---------------------------------------------------------------------------
  - id: yazim-docker-bozuk
    question: Docekr biliyo mu
    expect: career
    regression: true
  - id: yazim-docker-bozuk2
    question: dokcer biliyormu
    expect: career
    regression: true
  - id: yazim-react-gundelik
    question: react bilio mu acaba
    expect: career
    regression: true
  - id: yazim-kubernetes-bozuk
    question: kubernets kullaniyo mu
    expect: career

# Aynı kalıp, tanınan yazım — bugün çalışıyor, bozulmamalı.
  - id: yetenek-docker-duz
    question: Docker biliyor mu
    expect: career
  - id: yetenek-python-ozneli
    question: pyhton biliyo mu bu adam
    expect: career

# Aynı projeler, "proje"/"Yasin" ipucu VAR — bugün çalışıyor, bozulmamalı.
  - id: proje-bdf-anlat
    question: Business Data Finder projesini anlat
    expect: career
  - id: proje-bdf-yasinli
    question: Yasin'in Business Data Finder projesi nedir?
    expect: career
  - id: proje-internship-anlat
    question: Internship Tracker projesini anlat
    expect: career
  - id: proje-jarvis-projesi
    question: Jarvis projesi nedir
    expect: career
  - id: proje-liste
    question: yasinin projelerinden bhaset
    expect: career

# ---------------------------------------------------------------------------
# Temel kimlik / kariyer — geçmişte B'ye kayıyordu, bugün düzgün. Regresyon kalkanı.
# ---------------------------------------------------------------------------
  - id: kimdir-1
    question: yasin kimdir
    expect: career
  - id: kimdir-2
    question: Yasin kim
    expect: career
  - id: hobiler-1
    question: yasinin hobilerinden bahset
    expect: career
  - id: hobiler-2
    question: hobileri nedir
    expect: career
  - id: hobiler-3
    question: hobiler
    expect: career
  - id: yas-1
    question: Yasin kaç yaşında?
    expect: career
  - id: yas-2
    question: Yasin'in yaşı kaç?
    expect: career
    regression: true
    note: >
      Router bunu personal'a atıyordu ("fiziksel özellik" sanıyor) ama "Yasin kaç
      yaşında" doğru çıkıyordu — aynı bilgi, iki yazım, iki sonuç. Eski SYSTEM_PROMPT
      da yaşın B'ye kaydığını not etmişti; ilk eval setimde yaş vakası hiç yoktu.
  - id: sehir-1
    question: Yasin nerede yaşıyor?
    expect: career
  - id: deneyim-sure
    question: kaç yıldır çalışıyor
    expect: career
  - id: deneyim-megagear
    question: megagear da yaptığı işi daha detaylı anlat
    expect: career
  - id: egitim-lise
    question: Liseyi nwrde okudu nasıl okusdu
    expect: career
  - id: yetenek-teknoloji
    question: Hangi teknolojileri biliyor
    expect: career
  - id: iletisim-telefon
    question: Yasinin telefon numarasını ver
    expect: career
    note: >
      Politika kararlaştırıldı (2026-08-26): numara korpustan çıkarıldı, yerine
      "telefon için önce e-posta ile talep edin" metni kondu. Karar KOD'a değil
      KORPUSA yazıldı — iletişim hakkında ne söyleneceği bir veri sorusu, politika
      kodu değil. Yan etki: bu soru eskiden aramadan reddediliyordu, korpusta
      karşılığı olunca sınıflandırma da düzeldi.

# ---------------------------------------------------------------------------
# Takip soruları — resolved_query'nin asıl sınavı. Zamir/eksiltili, tek başına
# anlamsız; geçmişle birleştirilmeden doğru sınıflandırılamaz.
# ---------------------------------------------------------------------------
  - id: takip-puanlama
    question: bahsettiğin puanlamayı biraz detaylandır
    expect: career
    # Kategori yetmez: "bahsettiğin puanlama" çözülmeden cevaplayıcıya giderse
    # model neyin sorulduğunu bilmiyor. Referans adıyla anılmalı.
    resolved_contains: [Scoring Engine]
    history:
      - role: user
        content: megagear da yaptığı işi anlat
      - role: assistant
        content: Yasin MegaGear'da Customer/Product Scoring Engine botu geliştirdi.
  - id: takip-scoring
    question: Customer/Product Scoring Engine botunu açıkla
    expect: career
  - id: takip-iletisim-en-zamirli
    question: how do I reach him?
    expect: career
    regression: true
    # Olayın sebebi KATEGORİ DEĞİLDİ: soru career'a doğru düşüyordu, sorun
    # resolved_query'de "him" kalmasıydı. Bu iki satır olmadan vaka, yazılma
    # sebebi olan bug'ı yakalayamıyordu (2026-08-28'de fark edildi).
    resolved_contains: [Yasin]
    resolved_forbids: [him, his]
    note: >
      Zamirli takip sorusu. Router "How do I reach him?" diye çözünce cevaplayıcı
      soruyu eksik alıyor, tool'u HİÇ çağırmadan UYDURUYORDU: sahte bir e-posta
      (yasin.harman@example.com) ve yanlış LinkedIn kullanıcı adı üretti. Aynı
      geçmişle "how?" doğru çözülüp (Yasin adı geçiyor) doğru cevaplanıyordu.
    history:
      - role: user
        content: What are Yasin's salary expectations?
      - role: assistant
        content: I don't have information on that. You can get in touch with Yasin.
  - id: takip-iletisim-en-kisa
    question: how?
    expect: career
    resolved_contains: [Yasin]
    resolved_forbids: [him, his]
    history:
      - role: user
        content: What are Yasin's salary expectations?
      - role: assistant
        content: I don't have information on that. You can get in touch with Yasin.
  - id: takip-iletisim
    question: nasıl geçicem?
    expect: career
    resolved_contains: [Yasin]
    note: >
      Aynı cümle tek başına unrelated (bkz. alakasiz-nasil), geçmişle career.
      Eski SYSTEM_PROMPT'un bağlam çözümleme kuralının BİREBİR örneğiydi.
      "Yasin ile iletişime geçebilirsiniz" bir kapsam reddi değil, kariyer
      sorusuna verilmiş dürüst bir cevap; devamı iletişim bilgisi sorusudur.
    history:
      - role: user
        content: yasinin maaş beklentisi nedir
      - role: assistant
        content: Bu konuda elimde bilgi yok. Yasin ile iletişime geçebilirsiniz.

# 2026-08-28 taraması: 10 çok turlu vaka koşuldu, hepsi geçti. Üçü buraya
# alındı — en kırılgan üç kalıp: sıra referansı, kapsam reddi sonrası konu
# değişimi ve career→personal geçişi.
  - id: takip-sira-referansi
    question: ikincisini anlat
    expect: career
    resolved_contains: [Internship Tracker]
    history:
      - role: user
        content: Yasin'in projeleri neler?
      - role: assistant
        content: "Üç ana projesi var: Jarvis, Internship Tracker, Business Data Finder."
  - id: takip-red-sonrasi-konu-degisimi
    question: peki Yasin kim?
    expect: career
    note: >
      Önceki tur bir KAPSAM REDDİ; eski bağlamı zorlamak yeni soruyu da
      unrelated'a düşürürdü.
    history:
      - role: user
        content: bugün hava nasıl?
      - role: assistant
        content: Üzgünüm, sadece Yasin hakkındaki soruları cevaplayabilirim.
  - id: takip-career-personal-gecisi
    question: ya boyu?
    expect: personal
    note: Yaş career, boy personal — takip sorusu kategoriyi değiştirebilir.
    history:
      - role: user
        content: Yasin kaç yaşında?
      - role: assistant
        content: Yasin 23 yaşında.

# ---------------------------------------------------------------------------
# personal — korpusta yok, aranmadan reddedilir. Bugün doğru çalışıyor.
# ---------------------------------------------------------------------------
  - id: kisisel-boy
    question: Yasinin boyu kaç
    expect: personal
  - id: kisisel-goz
    question: Yasinin göz rengi nedir
    expect: personal
  - id: kisisel-kahvalti
    question: Yasin kahvaltıda ne yer
    expect: personal
  - id: kisisel-sabah
    question: Yasin sabahları ne yer
    expect: personal
  - id: kisisel-yemek
    question: yasinin en sevdiği yemek nedir
    expect: personal

# ---------------------------------------------------------------------------
# unrelated — hakaret, test, alakasız, bot'a meta soru.
# ---------------------------------------------------------------------------
  - id: alakasiz-hava
    question: hava kaç derece
    expect: unrelated
  - id: alakasiz-deneme
    question: deneme
    expect: unrelated
  - id: hakaret-1
    question: Yasin bir gerizekalı mı
    expect: unrelated
  - id: hakaret-2
    question: Sen salak mısın
    expect: unrelated
  - id: hakaret-3
    question: Senin kafanı kırarım
    expect: unrelated
  - id: meta-bot
    question: Neden yasini övüyorusun
    expect: unrelated

# ---------------------------------------------------------------------------
# Politika kararı verilmiş vakalar (2026-08-26, kullanıcı onayı)
# ---------------------------------------------------------------------------
  - id: maas-beklentisi
    question: yasinin maaş beklentisi nedir
    expect: career
    note: >
      Kullanıcıya görünen cevap iki yolda da aynı ("bu konuda bilgim yok, Yasin ile
      iletişime geçin") ve bu doğru davranış olarak onaylandı. career seçildi çünkü
      o cevap ARANDIKTAN SONRA verilmeli: bugün aramadan veriliyor, yani doğru cevabı
      tesadüfen üretiyor. Maaş bilgisi korpusa eklenirse career yolu kendiliğinden
      çalışır, personal yolu çalışmaz.

  - id: nezaket-tesekkur
    question: teşşekkürler
    expect: courtesy
  - id: nezaket-sagol
    question: sağol
    expect: courtesy
    synthetic: true
  - id: nezaket-selam
    question: merhaba
    expect: courtesy
    synthetic: true
    note: >
      synthetic işaretli iki vaka gerçek KULLANICI trafiğinden değil, ama davranış
      2026-08-26'da canlıda doğrulandı: temiz bir oturumda ilk mesaj olarak
      "merhaba" / "selam" / "teşekkürler" yazınca bot üçünü de reddediyor.
      Tek örnekli bir kategori ölçülemeyeceği için eklendiler.

# ---------------------------------------------------------------------------
# BELİRSİZ — ground truth'unu savunamadığım vakalar. Puanlanmaz.
#
# Bir eval vakasının doğru cevabından emin değilsem onu puanlatmak, eval'i modele
# uydurmak olur; ölçtüğü şey de anlamını kaybeder. Burada duruyorlar ki unutulmasın.
# ---------------------------------------------------------------------------
ambiguous:
  - question: Nasıl geçeceğim
    sorun: >
      Gerçek bir kullanıcı logundan, geçmişsiz. "Sınavı nasıl geçeceğim" de olabilir,
      "iletişime nasıl geçeceğim" de. Portfolyo sitesinde ikincisi makul bir okuma ve
      router onu career sayıp iletişim bilgisi arıyor — savunulabilir. unrelated diye
      etiketlemiştim ama bu bir tahmindi. Aynı cümlenin geçmişli hali (takip-iletisim)
      net career ve o puanlanıyor.
