# Retrieval eval golden seti.
#
# Beklenti türleri (güçlüden zayıfa):
#   expected_all        parçaların HEPSİ AYNI chunk'ta → o chunk hayatta kalmalı.
#   expected_substrings parçalardan BİRİ herhangi bir chunk'ta.
#   expected_sources    bu dosyalardan HERHANGİ bir chunk döndü mü.
#   negative: true      eşik üstü hiç sonuç dönmemeli.
#
# 2026-08-27 denetimi: 28 pozitif vakanın 12'si "gevşek"ti — dönen sonuçta birden
# fazla chunk tek başına beklentiyi karşılıyordu, yani doğru chunk elenmiş olsa bile
# vaka yeşil kalırdı. Bulgu B canlıda tam bu boşluktan geçti. 10'u expected_all'a
# çevrildi; kalan 2'sinin gevşekliği bilinçli ve yerinde gerekçesi yazılı.

# --- Projeler ---
- id: proje-liste
  # Genel bakış chunk'ı olmadan cevap eksik kalır: tek tek proje chunk'ları
  # dönerse model listeyi kısmi verir. Eskiden 4 chunk'ın her biri tek başına
  # yetiyordu (expected_sources: projeler.md).
  question: "Yasin'in projelerinden bahseder misin?"
  expected_all: ["üç ana proje şunlardır", "Internship Tracker"]
- id: proje-liste-kisa
  question: "projeler"
  expected_all: ["üç ana proje şunlardır", "Internship Tracker"]
- id: proje-bdf
  # Eskiden "Projelerin Listesi" chunk'ı da tek başına yetiyordu; oysa soru
  # projenin kendisini soruyor, tek satırlık liste maddesi cevap değil.
  question: "Business Data Finder projesi nedir?"
  expected_all: ["BusinessInfoFinder", "SerpAPI"]
- id: proje-bdf-teknoloji
  question: "Business Data Finder hangi teknolojilerle geliştirildi?"
  expected_substrings: ["SerpAPI", "Dokploy"]
- id: proje-asistan
  question: "Bu yapay zeka asistanı nasıl çalışıyor?"
  expected_substrings: ["RAG", "FastAPI"]
- id: proje-asistan-rag
  question: "Yasin RAG mimarisi ile ne yaptı?"
  expected_sources: [projeler.md]
- id: proje-etl
  question: "İş ilanı ETL projesi hakkında bilgi verir misin?"
  expected_substrings: ["Scrapy", "APScheduler"]
- id: proje-etl-parafraz
  question: "Yasin veri çekme ve dashboard ile ilgili ne yaptı?"
  expected_sources: [projeler.md, deneyim.md]
  expected_substrings: ["Streamlit", "Scrapy"]

# --- Yetenekler ---
- id: yetenek-diller
  # En kötü vakaydı: "Python" korpusta her yerde geçtiği için 5 ayrı chunk tek
  # başına yetiyordu. Soruyu asıl cevaplayan chunk "Programlama Dilleri".
  question: "Yasin hangi programlama dillerini biliyor?"
  expected_all: ["ana programlama dilidir", "SQL: PostgreSQL"]
- id: yetenek-teknolojiler
  # Bulgu B'nin saklandığı vaka: yetenekler.md'nin diğer 4 chunk'ı testi yeşil
  # tutarken teknoloji listesinin ta kendisi rerank'te eleniyordu.
  question: "Yasin hangi teknolojileri kullanıyor?"
  expected_all: ["Dokploy ve Coolify", "SQLAlchemy ORM"]
- id: yetenek-scraping
  # Uzmanlık chunk'ı "web scraping" ifadesini düz yazıda geçirdiği için tek
  # başına yetiyordu; hangi araçlarla sorusunu cevaplayan chunk bu değil.
  question: "Yasin web scraping yapabiliyor mu?"
  expected_all: ["Scrapy ve Playwright — web scraping"]
- id: yetenek-docker
  # BİLEREK GEVŞEK. Soru "tecrübesi var mı" diye soruyor ve cevabı gerçekten üç
  # yerde: yetenek listesi, proje deployment'ları, iş deneyimi. Tek chunk'a
  # sabitlemek beklentiyi gerçekten doğru olan cevaplardan dar hale getirirdi.
  # Teknoloji listesinin kendisini sabitleyen vaka: yetenek-docker-biliyor-mu.
  question: "Yasin'in Docker ve deployment tecrübesi var mı?"
  expected_sources: [yetenekler.md, projeler.md, deneyim.md]
- id: yetenek-ogrenilen
  question: "Yasin şu anda hangi teknolojileri öğreniyor?"
  expected_substrings: ["Hugging Face", "SEO"]
- id: yetenek-uzmanlik
  # "AI" ve "otomasyon" korpusun yarısında geçiyor; 4 chunk tek başına yetiyordu.
  question: "Yasin'in uzmanlık alanı nedir?"
  expected_all: ["temel uzmanlığı", "uçtan uca otomasyon çözümleri"]

# --- Deneyim ---
- id: deneyim-megagear
  # "İş Deneyimlerinin Listesi" chunk'ı MegaGear'ı üç satırda özetliyor ve
  # expected_sources'u tek başına karşılıyordu — "ne yaptı" sorusunun cevabı o değil.
  question: "Yasin MegaGear'da ne yaptı?"
  expected_all: ["Customer/Product Scoring Engine", "172.000 sipariş"]
- id: deneyim-megagear-detay
  question: "Yasin'in e-ticaret veri altyapısı deneyimi var mı?"
  expected_substrings: ["Etsy", "Shopify"]
- id: deneyim-scoring
  question: "Customer Scoring Engine nedir?"
  expected_substrings: ["segment", "Python"]
- id: deneyim-upwork
  question: "Yasin freelance çalışıyor mu?"
  expected_all: ["Outlier platformunda", "pull request"]
- id: deneyim-scaleai
  question: "Yasin'in LLM eğitimi ile ilgili deneyimi var mı?"
  expected_all: ["Scale AI", "pull request"]
- id: deneyim-topluluk
  # GDG On Campus 20.07.2026'da korpustan çıkarıldı; artık topluluk verisi yok.
  question: "Yasin hangi topluluklarda yer alıyor?"
  negative: true

# --- Hakkımda ---
- id: hakkimda-yas
  question: "Yasin kaç yaşında?"
  expected_substrings: ["21"]
- id: hakkimda-egitim
  question: "Yasin hangi üniversitede okuyor?"
  expected_substrings: ["Haliç"]
- id: hakkimda-ortalama
  question: "Yasin'in not ortalaması kaç?"
  expected_substrings: ["3.03"]
- id: hakkimda-ingilizce
  question: "Yasin'in İngilizce seviyesi nasıl?"
  expected_substrings: ["Profesyonel", "İngilizce"]
- id: hakkimda-iletisim
  question: "Yasin ile nasıl iletişime geçebilirim?"
  expected_substrings: ["contact@yasinharman.dev"]
- id: hakkimda-hobi
  question: "Yasin'in hobileri neler?"
  expected_substrings: ["powerlifting"]
- id: hakkimda-konum
  # BİLEREK GEVŞEK. Konum hem "Kimdir" hem "İletişim Bilgileri" chunk'ında var
  # ve ikisi de soruyu tam cevaplıyor; birini seçmek keyfi olurdu.
  question: "Yasin nerede yaşıyor?"
  expected_substrings: ["İstanbul"]

# --- Regresyon: bulgu B (2026-08-27) ---
# "Yetenekler > Teknolojiler ve Araçlar" chunk'ı vector aramada 3. sırada geliyor
# ama Cohere rerank'te 0.0055 alıp eşiğin (0.40) çok altında eleniyordu. Sebep sıra
# değil BİÇİM: chunk özne ve fiil içermeyen çıplak bir "X — tanım" listesiydi.
# Ölçüldü: aynı içeriğe tek cümlelik özneli bir giriş eklenince skor 0.0055 → 1.0000.
#
# Bu vakalar expected_all kullanıyor, expected_sources DEĞİL: eski biçimde
# "yetenekler.md'den bir şey geldi mi" sorusu, doğru chunk elenmişken bile
# yeşil kalıyordu — bug tam bu yüzden 30/30'luk golden set'ten kaçtı.
- id: yetenek-teknolojiler-biliyor
  question: "Yasin hangi teknolojileri biliyor?"
  expected_all: ["Dokploy", "SQLAlchemy", "Streamlit"]
- id: yetenek-docker-biliyor-mu
  # Beklenti bilerek tam madde metni: ilk denemede ["Docker", "containerization"]
  # yazmistim ve vaka YESIL dondu — ikisi hakkimda.md'nin duz yazi chunk'inda da
  # gecıyor, yani teknoloji listesi yine elenmisken test gecmis oluyordu.
  question: "Yasin Docker biliyor mu?"
  expected_all: ["Docker — containerization", "SQLAlchemy ORM"]

# --- Negatifler: eşik üstü sonuç dönmemeli ---
- id: neg-maas
  question: "Yasin'in maaş beklentisi nedir?"
  negative: true
- id: neg-hava
  question: "Bugün İstanbul'da hava nasıl?"
  negative: true
- id: neg-tarif
  question: "Bana bir kek tarifi verir misin?"
  negative: true
