[project]
name = "portfolio-rag-backend"
version = "0.1.0"
description = "FastAPI RAG backend for yasinharman portfolio chat"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "cohere>=5.10",
  "supabase>=2.8",
  "langchain>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "langchain-community>=0.3,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "tenacity>=9.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
  "integration: gerçek API anahtarları ve canlı Supabase gerektirir",
]
asyncio_mode = "auto"
