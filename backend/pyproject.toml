[project]
name = "portfolio-rag-backend"
version = "0.1.0"
description = "FastAPI RAG backend for yasinharman portfolio chat"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "cohere>=5.10",
  "supabase>=2.8",
  "langchain>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "langchain-community>=0.3,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "tenacity>=9.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  # Ust sinir bilerek: minor bir surum secili gruplara yeni kural ekleyip
  # kodumuz degismeden CI'i kirabiliyor. Yukseltme bilincli bir adim olsun.
  "ruff>=0.16,<0.17",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Kural seti bilerek acikca yaziliyor. Ruff'in varsayilan seti surum surum
# genisliyor; ona guvenirsek bir `pip install -U ruff` CI'i bizim kodumuz hic
# degismeden kirmizi yapabilir (0.16 tam bunu yapti: 14 yeni hata).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "BLE", "RUF"]
# RUF001-003: "ambiguous unicode". Korpus, promptlar ve yorumlar Turkce; bu
# kurallar 676 kez i/ı, s/ş, g/ğ diye bagirip sinyali tamamen bogar.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# B008 (varsayilan argumanda fonksiyon cagrisi) FastAPI'nin kendi idiyomu:
# Depends(...) / File(...) / Form(...) tam olarak orada durmak zorunda.
"app/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
markers = [
  "integration: gerçek API anahtarları ve canlı Supabase gerektirir",
]
filterwarnings = [
  # langchain, router'in structured output'unu (Route) serilestirirken her cagride
  # bunu uretiyor. Zararsiz ama integration ciktisinda 29 kez tekrarlanip gercek
  # uyarilari gomuyor. eval/run_routing.py ayni filtreyi kendi icinde kuruyor.
  "ignore:Pydantic serializer warnings:UserWarning",
]
asyncio_mode = "auto"
